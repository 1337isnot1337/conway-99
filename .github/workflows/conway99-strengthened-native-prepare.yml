name: Conway 99 strengthened F0 native preparation

on:
  push:
    branches: [research/global-constraints-ab2f]
    paths:
      - .github/workflows/conway99-strengthened-native-prepare.yml
      - experiments/logs/root-prism-free/f0-strengthened-native-ci-request01.json

permissions:
  contents: read
  actions: read

concurrency:
  group: conway99-strengthened-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-and-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out the explicit frozen sources and mathematical inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/conway99-strengthened-native-prepare.yml
            /experiments/logs/root-prism-free/f0-boolean-shared-native-preparation01-cold/owner.json
            /experiments/logs/root-prism-free/f0-boolean-shared-native-preparation01-cold/report.json
            /experiments/logs/root-prism-free/f0-boolean-shared-native-preparation01/model.pb.gz
            /experiments/logs/root-prism-free/f0-boolean-shared-native-preparation01/overlay-proof.json.gz
            /experiments/logs/root-prism-free/f0-boolean-shared-prism-transfer-inventory01-cold/owner.json
            /experiments/logs/root-prism-free/f0-boolean-shared-prism-transfer-inventory01-cold/report.json
            /experiments/logs/root-prism-free/f0-boolean-shared-prism-transfer-inventory01/complete-inventory.json.gz
            /experiments/logs/root-prism-free/f0-exterior-row-domains02.json.gz
            /experiments/logs/root-prism-free/f0-exterior-triangle-schur-v8-census01.json
            /experiments/logs/root-prism-free/f0-four-exterior-cross-quota-certificate-replay01-finalization.json
            /experiments/logs/root-prism-free/f0-four-exterior-cross-quota-certificate-replay01.json
            /experiments/logs/root-prism-free/f0-four-exterior-cross-quota-independent01-finalization.json
            /experiments/logs/root-prism-free/f0-four-exterior-cross-quota-independent01.json
            /experiments/logs/root-prism-free/f0-four-exterior-cross-quota-root-acceptance01.json
            /experiments/logs/root-prism-free/f0-four-exterior-prism-standalone-proof-independent-review01.json
            /experiments/logs/root-prism-free/f0-full-core-schur-kernels01.json.gz
            /experiments/logs/root-prism-free/f0-signed-edge-literal-replay01-finalization.json
            /experiments/logs/root-prism-free/f0-signed-edge-literal-replay01.json
            /experiments/logs/root-prism-free/f0-signed-edge-root-acceptance01.json
            /experiments/logs/root-prism-free/f0-single-edge-schur-certificates01-finalization.json
            /experiments/logs/root-prism-free/f0-single-edge-schur-certificates01.json
            /experiments/logs/root-prism-free/f0-spectral-gap-pair-independent-cold01.json
            /experiments/logs/root-prism-free/f0-spectral-gap-pair-root-acceptance01.json
            /experiments/logs/root-prism-free/f0-spectral-gap-pair-v8-census01.json
            /experiments/logs/root-prism-free/f0-strengthened-append-replay-independent-sets-source-review01.json
            /experiments/logs/root-prism-free/f0-strengthened-native-ci-request01.json
            /experiments/logs/root-prism-free/f0-strengthened-native-ci-root-gate01.json
            /experiments/logs/root-prism-free/f0-strengthened-native-configuration01.json
            /experiments/logs/root-prism-free/f0-strengthened-native-final-configuration-independent-review01.json
            /experiments/logs/root-prism-free/f0-strengthened-native-producer-ci-independent-source-review01.json
            /experiments/logs/root-prism-free/f0-triangle-schur-independent-cold-root-acceptance01.json
            /experiments/logs/root-prism-free/f0-triangle-schur-independent-cold-summary01.json
            /experiments/workspace/root_prism_free_f0_boolean_shared_model.py
            /experiments/workspace/root_prism_free_f0_fixed_selection_exterior_query.py
            /experiments/workspace/root_prism_free_f0_strengthened_append.py
            /experiments/workspace/root_prism_free_f0_strengthened_append_replay.py
            /experiments/workspace/root_prism_free_f0_strengthened_ci.py
            /research/root_prism_free_f0_four_exterior_prism_outage_proof.md
      - name: Verify the one-run gate and compile all pinned Python sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, sys
          assert sys.version_info[:2] == (3, 12)
          assert os.environ['GITHUB_RUN_ATTEMPT'] == '1'
          request = json.loads(pathlib.Path('experiments/logs/root-prism-free/f0-strengthened-native-ci-request01.json').read_bytes())
          gate_path = pathlib.Path(request['gate']['path'])
          assert hashlib.sha256(gate_path.read_bytes()).hexdigest() == request['gate']['sha256']
          gate = json.loads(gate_path.read_bytes())
          event = json.loads(pathlib.Path(os.environ['GITHUB_EVENT_PATH']).read_bytes())
          assert event['before'] == gate['expected_parent']
          assert event['ref'] == 'refs/heads/research/global-constraints-ab2f'
          assert gate['status'] == 'AUTHORIZE_ONE_STRENGTHENED_NATIVE_PREPARATION_AND_SEPARATE_COLD'
          assert gate['optimizer_calls_allowed'] == request['optimizer_calls_allowed'] == 0
          assert gate['native_query_allowed'] is False and request['native_query_allowed'] is False
          assert request['mode'] == 'one-preparation-and-independent-cold'
          for name in ('driver_source', 'producer_source', 'cold_source', 'configuration'):
              assert request[name] == gate[name]
          for entry in gate['dependencies']:
              path = pathlib.Path(entry['path'])
              raw = path.read_bytes()
              assert hashlib.sha256(raw).hexdigest() == entry['sha256'], str(path)
              if 'bytes' in entry:
                  assert len(raw) == entry['bytes'], str(path)
              if path.suffix == '.py':
                  compile(raw.decode('utf-8'), str(path), 'exec')
          print(json.dumps({'gate': 'PASS', 'optimizer_calls_allowed': 0, 'expected_rows': 257594, 'expected_variables': 68934}))
          PY
      - name: Install the pinned native and protobuf runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .ci-strengthened-venv
          .ci-strengthened-venv/bin/python -m pip install --disable-pip-version-check --only-binary=:all: ortools==9.15.6755 protobuf==6.33.6
          .ci-strengthened-venv/bin/python -m pip freeze > experiments/logs/root-prism-free/f0-strengthened-native-ci01-runtime-packages.txt
      - name: Run one preparation and its separately owned independent cold
        shell: bash
        run: |
          set -euo pipefail
          .ci-strengthened-venv/bin/python experiments/workspace/root_prism_free_f0_strengthened_ci.py --request experiments/logs/root-prism-free/f0-strengthened-native-ci-request01.json
      - name: Export exact small reports, suffix, and the accepted three-row inventory
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib
          prefix = pathlib.Path('experiments/logs/root-prism-free/')
          roots = [prefix / name for name in ('f0-strengthened-native-ci01-controls', 'f0-strengthened-native-ci01', 'f0-strengthened-native-ci01-cold')]
          selected = []
          for root in roots:
              if root.is_dir():
                  selected.extend(p for p in root.rglob('*') if p.is_file() and (p.suffix in ('.json', '.log') or p.name in ('suffix.pb.gz', 'valid-control.pb')))
          selected.extend(prefix / name for name in ('f0-strengthened-native-ci01-run.json', 'f0-strengthened-native-ci01-runtime-packages.txt'))
          selected.append(pathlib.Path('experiments/logs/root-prism-free/f0-boolean-shared-prism-transfer-inventory01/complete-inventory.json.gz'))
          files, total = [], 0
          for path in sorted(set(selected)):
              if not path.is_file():
                  continue
              raw = path.read_bytes()
              total += len(raw)
              assert total <= 16 << 20
              files.append({'path': str(path), 'sha256': hashlib.sha256(raw).hexdigest(), 'bytes': len(raw), 'base64': base64.b64encode(raw).decode('ascii')})
          bundle = {'schema': 'conway99.public_ci_bundle.v1', 'files': files, 'optimizer_calls_allowed': 0}
          raw = json.dumps(bundle, sort_keys=True, separators=(',', ':')).encode()
          encoded = base64.b64encode(gzip.compress(raw, mtime=0)).decode('ascii')
          assert len(encoded) <= 12 << 20
          print('CONWAY99_STRENGTHENED_BUNDLE_BEGIN')
          for offset in range(0, len(encoded), 4096):
              print(encoded[offset:offset+4096])
          print('CONWAY99_STRENGTHENED_BUNDLE_END')
          PY
      - name: Retain all native preparation and independent cold files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conway99-strengthened-native-${{ github.sha }}
          path: |
            experiments/logs/root-prism-free/f0-strengthened-native-ci01-controls/
            experiments/logs/root-prism-free/f0-strengthened-native-ci01/
            experiments/logs/root-prism-free/f0-strengthened-native-ci01-cold/
            experiments/logs/root-prism-free/f0-strengthened-native-ci01-run.json
            experiments/logs/root-prism-free/f0-strengthened-native-ci01-runtime-packages.txt
          if-no-files-found: error
          retention-days: 7

  export-model-archive:
    needs: prepare-and-replay
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1]
    steps:
      - name: Read this run's exact public artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: conway99-strengthened-native-${{ github.sha }}
          path: artifact
      - name: Export one bounded native archive chunk
        shell: bash
        env:
          CONWAY_ARCHIVE_PART: ${{ matrix.part }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib
          root = pathlib.Path('artifact')
          matches = list(root.rglob('f0-strengthened-native-ci01/model.pb.gz'))
          if not matches:
              print('No native model archive was produced; no model bytes accepted by this export.')
              raise SystemExit(0)
          assert len(matches) == 1
          path = matches[0]
          report = json.loads((path.parent / 'report.json').read_bytes())
          raw = path.read_bytes()
          full_sha = hashlib.sha256(raw).hexdigest()
          assert len(raw) == report['model']['archive_bytes'] and full_sha == report['model']['archive_sha256']
          assert len(raw) <= 8 << 20
          part, size = int(os.environ['CONWAY_ARCHIVE_PART']), 4 << 20
          assert part in (0, 1)
          offset = min(part * size, len(raw))
          data = raw[offset:min((part+1)*size, len(raw))]
          header = {'schema': 'conway99.public_native_archive_chunk.v1', 'path': 'experiments/logs/root-prism-free/f0-strengthened-native-ci01/model.pb.gz', 'part': part, 'part_count': 2, 'offset': offset, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(), 'full_bytes': len(raw), 'full_sha256': full_sha, 'export_is_not_model_acceptance': True}
          print('CONWAY99_STRENGTHENED_MODEL_CHUNK_BEGIN')
          print(json.dumps(header, sort_keys=True, separators=(',', ':')))
          encoded = base64.b64encode(data).decode('ascii')
          for offset in range(0, len(encoded), 4096):
              print(encoded[offset:offset+4096])
          print('CONWAY99_STRENGTHENED_MODEL_CHUNK_END')
          PY
